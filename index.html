<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Meals Explorer Website For Free Recipes" />
		<link rel="stylesheet" href="main.css" />
		<!-- Fav Icon -->
		<link
			rel="shortcut icon"
			href="images/14852523_5528439.jpg"
			type="image/x-icon" />
		<title>Meals Explorer</title>
	</head>
	<body>
    <!-- Start Overlay -->
    <div class="overlay hidden"></div>
    <!-- End Overlay -->
		<!-- Start Header -->
		<header>
			<div class="container">
				<nav>
					<div class="image">
						<a href="#">
              <!-- <img src="images/restaurant-tasty-food-logo-design.png" alt="Logo"/> -->
              <img src="images/14852523_5528439.jpg" alt="Logo" loading="lazy"/>
            </a>
					</div>
					<search>
            <i class="fa-solid fa-magnifying-glass"></i>
						<input type="search" placeholder="Search for meal" maxlength="1"/>
					</search>
				</nav>
			</div>
		</header>
		<!-- End Header -->
		<!-- Start Hero Section -->
		<section class="hero">
			<div class="container">
				<div class="content">
					<div class="text">
						<h1>Where Every Recipe <span>Tells a Story</span></span></h1>
						<img src="images/76675727_9838591.png" alt="Dish Meal" />
					</div>
					<select name="category" id="category"></select>
				</div>
			</div>
		</section>
		<!-- End Hero Section -->
    <!-- ٍٍStart Main Section -->
    <main>
      <div class="container">
        <div class="cards"></div>
      </div>
    </main>
    <!-- End Main Section -->
    <!-- Start Footer -->
    <footer>
      <p>Made with 🧡 for food lovers</p>
    </footer>
    <!-- End Footer -->
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/306f44334f.js" crossorigin="anonymous"></script>
		<script src="script.js"></script>
	</body>
</html>
